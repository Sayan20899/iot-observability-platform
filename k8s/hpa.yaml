apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iot-api-hpa
  namespace: iot-observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iot-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
