apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-api
  namespace: iot-observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iot-api
  template:
    metadata:
      labels:
        app: iot-api
    spec:
      containers:
        - name: iot-api
          image: YOUR_DOCKERHUB_USERNAME/iot-observability-platform:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://iot_user:$(DB_PASSWORD)@postgres:5432/iot_observability
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: iot-api
  namespace: iot-observability
spec:
  type: LoadBalancer
  selector:
    app: iot-api
  ports:
    - port: 80
      targetPort: 8000
