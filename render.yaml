services:
  - type: web
    name: iot-observability-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iot-observability-db
          property: connectionString
databases:
  - name: iot-observability-db
    plan: free
    databaseName: iot_observability
    user: iot_user
